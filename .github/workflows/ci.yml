name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gopher-kvs/go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: gopher-kvs
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gopher-kvs/go.mod
      - name: Unit tests
        run: cd gopher-kvs && go test -race ./internal/...
  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gopher-kvs/go.mod
      - name: E2E tests
        run: cd gopher-kvs && go test -v -timeout 120s ./test/e2e/